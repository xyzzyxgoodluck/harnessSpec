# Alembic config. Keep this file ASCII-only: configparser reads it with the
# OS locale encoding (cp936/GBK on zh-CN Windows), so non-ASCII bytes break it.
# Single source of truth for the DB URL: migrations/env.py reads it from Settings.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
