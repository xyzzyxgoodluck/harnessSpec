# 本地开发用中间件编排：仅用于本机开发/联调，禁止用于生产（生产用云数据库与 Secret 注入）。
# 生产环境准备类说明归项目 README 与 docs/ARCHITECTURE.md §9，不写入 AGENTS.md。
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sample
      POSTGRES_USER: postgres
      # 本机开发才允许 trust（无需口令）；生产一律口令 + TLS，且口令来自 Secret。
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sample"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
